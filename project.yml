name: Emulsion
options:
  bundleIdPrefix: com.dwjames
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: VF945J28YU
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  EmulsionCore:
    path: Packages/EmulsionCore
  EmulsionUI:
    path: Packages/EmulsionUI
targets:
  Emulsion:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Films
        type: folder
      - path: App/SelfTest
        type: folder
    dependencies:
      - target: EmulsionPhotos
      - sdk: Photos.framework
      - package: EmulsionCore
        product: EmulsionCore
      - package: EmulsionUI
        product: EmulsionUI
    entitlements:
      path: App/Emulsion.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Emulsion
        CFBundleName: Emulsion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright 2026 DW James. Film looks: Pat David, CC BY-SA 4.0."
        NSPhotoLibraryUsageDescription: "Emulsion shows your Photos library so you can apply film looks. Edits are saved non-destructively; Revert to Original in Photos restores your picture."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.jpeg
              - public.heic
              - public.png
              - public.tiff
              - public.camera-raw-image
              - com.adobe.raw-image
              - public.image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.emulsion
        PRODUCT_NAME: Emulsion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  EmulsionPhotos:
    type: app-extension
    platform: macOS
    sources:
      - path: PhotosExtension
        excludes:
          - Info.plist
          - EmulsionPhotos.entitlements
      - path: Films
        type: folder
    dependencies:
      - package: EmulsionCore
        product: EmulsionCore
      - package: EmulsionUI
        product: EmulsionUI
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
    entitlements:
      path: PhotosExtension/EmulsionPhotos.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: PhotosExtension/Info.plist
      properties:
        CFBundleDisplayName: Emulsion
        CFBundleName: EmulsionPhotos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.photo-editing
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PhotoEditingViewController
          NSExtensionAttributes:
            PHSupportedMediaTypes:
              - Image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwjames.emulsion.photos
        PRODUCT_NAME: EmulsionPhotos
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Emulsion:
    build:
      targets:
        Emulsion: all
        EmulsionPhotos: all
    run:
      config: Debug
