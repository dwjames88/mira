name: Mira
options:
  bundleIdPrefix: com.fieldframes
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "8"
  configs:
    Release:
      # Strip local symbols from the shipped app, extension and iOS binaries (about 19 MB less on the Mac). `xcodebuild
      # build` only strips with DEPLOYMENT_POSTPROCESSING; the dSYMs are written first and keep the symbols
      # (scripts/release.sh saves them next to the release). Release already compiles -O, whole module, with dSYMs.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
packages:
  MiraCore:
    path: Packages/MiraCore
  MiraUI:
    path: Packages/MiraUI
  MiraCamera:
    path: Packages/MiraCamera
targets:
  Mira:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Films
        type: folder
      - path: App/SelfTest
        type: folder
    dependencies:
      - target: MiraPhotos
      - sdk: Photos.framework
      - package: MiraCore
        product: MiraCore
      - package: MiraCore
        product: MiraUpdates
      - package: MiraUI
        product: MiraUI
    entitlements:
      path: App/Mira.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).$(MIRA_BUNDLE_PREFIX).mira
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleName: Mira
        CFBundleShortVersionString: $(MARKETING_VERSION)
        MiraAppGroup: $(DEVELOPMENT_TEAM).$(MIRA_BUNDLE_PREFIX).mira
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright 2026 FieldFrames. Film looks: Pat David, CC BY-SA 4.0."
        NSPhotoLibraryUsageDescription: "Mira shows your Photos library so you can apply film looks. Edits are saved non-destructively; Revert to Original in Photos restores your picture."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.jpeg
              - public.heic
              - public.png
              - public.tiff
              - public.camera-raw-image
              - com.adobe.raw-image
              - public.image
          - CFBundleTypeName: Mira Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.fieldframes.mira.preset
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.fieldframes.mira.preset
            UTTypeDescription: Mira Preset
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mirapreset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MIRA_BUNDLE_PREFIX).mira
        PRODUCT_NAME: Mira
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  MiraPhotos:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: PhotosExtension
        excludes:
          - Info.plist
          - MiraPhotos.entitlements
      - path: Films
        type: folder
    dependencies:
      - package: MiraCore
        product: MiraCore
      - package: MiraUI
        product: MiraUI
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
    entitlements:
      path: PhotosExtension/MiraPhotos.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).$(MIRA_BUNDLE_PREFIX).mira
    info:
      path: PhotosExtension/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleName: MiraPhotos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        MiraAppGroup: $(DEVELOPMENT_TEAM).$(MIRA_BUNDLE_PREFIX).mira
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.photo-editing
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PhotoEditingViewController
          NSExtensionAttributes:
            PHSupportedMediaTypes:
              - Image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MIRA_BUNDLE_PREFIX).mira.photos
        PRODUCT_NAME: MiraPhotos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APPLICATION_EXTENSION_API_ONLY: YES
  MiraiOS:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: iOSApp/Sources
      - path: App/Sources/PhotoLibrary/SidebarLoader.swift
      - path: iOSApp/Resources
      - path: Films
        type: folder
    dependencies:
      - package: MiraCore
        product: MiraCore
      - package: MiraUI
        product: MiraUI
      - package: MiraCamera
        product: MiraCameraKit
      - package: MiraCamera
        product: MiraCamera
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleName: Mira
        CFBundleShortVersionString: $(MARKETING_VERSION)
        MiraAppGroup: $(DEVELOPMENT_TEAM).$(MIRA_BUNDLE_PREFIX).mira
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Mira shows your photo library so you can browse your pictures and apply film looks."
        NSPhotoLibraryAddUsageDescription: "Mira saves your edited pictures to your Photos library."
        NSCameraUsageDescription: "Mira uses the camera to take pictures through your chosen film."
        NSLocationWhenInUseUsageDescription: "Mira adds your location to frames only if you turn on Add location to frames in the camera settings."
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.fieldframes.mira.camera
            UIApplicationShortcutItemTitle: Load film
            UIApplicationShortcutItemIconSymbolName: camera
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mira Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.fieldframes.mira.preset
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.fieldframes.mira.preset
            UTTypeDescription: Mira Preset
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mirapreset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MIRA_BUNDLE_PREFIX).mira.ios
        PRODUCT_NAME: Mira
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
  # UI tests drive the iOS app inside the simulator only (never the host pointer or keyboard).
  # Grant Photos first: xcrun simctl privacy <udid> grant photos com.fieldframes.mira.ios
  MiraiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSApp/UITests
    dependencies:
      - target: MiraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MIRA_BUNDLE_PREFIX).mira.ios.uitests
        TEST_TARGET_NAME: MiraiOS
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  MiraiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSTests
    dependencies:
      - target: MiraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MIRA_BUNDLE_PREFIX).mira.ios.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mira.app/Mira
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Mira:
    build:
      targets:
        Mira: all
        MiraPhotos: all
    run:
      config: Debug
  MiraiOS:
    build:
      targets:
        MiraiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiraiOSTests
        - MiraiOSUITests
