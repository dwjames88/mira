name: Mira
options:
  bundleIdPrefix: com.fieldframes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: VF945J28YU
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  MiraCore:
    path: Packages/MiraCore
  MiraUI:
    path: Packages/MiraUI
targets:
  Mira:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Films
        type: folder
      - path: App/SelfTest
        type: folder
    dependencies:
      - target: MiraPhotos
      - sdk: Photos.framework
      - package: MiraCore
        product: MiraCore
      - package: MiraCore
        product: MiraUpdates
      - package: MiraUI
        product: MiraUI
    entitlements:
      path: App/Mira.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleName: Mira
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright 2026 FieldFrames. Film looks: Pat David, CC BY-SA 4.0."
        NSPhotoLibraryUsageDescription: "Mira shows your Photos library so you can apply film looks. Edits are saved non-destructively; Revert to Original in Photos restores your picture."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.jpeg
              - public.heic
              - public.png
              - public.tiff
              - public.camera-raw-image
              - com.adobe.raw-image
              - public.image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fieldframes.mira
        PRODUCT_NAME: Mira
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  MiraPhotos:
    type: app-extension
    platform: macOS
    sources:
      - path: PhotosExtension
        excludes:
          - Info.plist
          - MiraPhotos.entitlements
      - path: Films
        type: folder
    dependencies:
      - package: MiraCore
        product: MiraCore
      - package: MiraUI
        product: MiraUI
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
    entitlements:
      path: PhotosExtension/MiraPhotos.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: PhotosExtension/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleName: MiraPhotos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.photo-editing
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PhotoEditingViewController
          NSExtensionAttributes:
            PHSupportedMediaTypes:
              - Image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fieldframes.mira.photos
        PRODUCT_NAME: MiraPhotos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Mira:
    build:
      targets:
        Mira: all
        MiraPhotos: all
    run:
      config: Debug
